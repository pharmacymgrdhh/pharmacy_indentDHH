<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation Errorless - Indent Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            flex: 1;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #34495e;
            font-size: 14px;
        }
	.round-cb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            vertical-align: middle;
            accent-color: #f39c12;
            cursor: pointer;
        }
        .opd-section {
            display: none; /* सुरुवातीला लपवलेले असेल */
            background: #e8f8f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #1abc9c;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
        }
        .btn:hover { background-color: #2980b9; }
        .btn-submit {
            background-color: #27ae60;
            margin-top: 20px;
            font-weight: bold;
        }
        .btn-submit:hover { background-color: #2196f3; }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th { background-color: #f2f2f2; }
        .delete-btn {
            color: red;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }
        .section-divider {
            border-top: 1px dashed #ccc;
            margin: 20px 0;
        }
        .loading-text {
            color: #e67e22;
            font-size: 12px;
            font-weight: normal;
            display: none;
        }
        /* A5/A4 Print CSS - Official Template */
        #printTemplate { display: none; }
        @media print {
            body { background-color: white; margin: 0; padding: 0; }
            .container { display: none !important; }
            #printTemplate { display: block !important; width: 100%; font-family: Arial, sans-serif; }
            
            .print-table { width: 100%; border-collapse: collapse; font-size: 14px; }
            .print-table td { border: 1px solid #b2ebf2; padding: 6px; }
            .print-table .label { font-weight: bold; background-color: #f4f4f4; width: 20%; -webkit-print-color-adjust: exact; }
            .print-table .blue-bg { 
                background-color: #4a86e8 !important; 
                color: white !important; 
                font-weight: bold; 
                text-align: center;
                -webkit-print-color-adjust: exact; 
                color-adjust: exact;
            }
            .print-table .logo-td { width: 25%; text-align: center; padding: 5px; border: 1px solid #4a86e8;}
            
            @page { margin: 10mm; }
        }
        
        /* नवीन प्रिंट बटणासाठी स्टाईल */
        .btn-print-nursing {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            display: none; /* सुरुवातीला लपवलेले असेल */
        }
        .btn-print-nursing:hover { background-color: #d68910; }
    </style>
</head>
<body>
    <div id="loginOverlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #2c3e50; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;">
    <img src="dhh.png" alt="Hospital Logo" style="height: 70px; margin-bottom: 20px; background-color: white; padding: 5px; border-radius: 5px;">
    <h2 style="color: white; border-bottom: none; margin-bottom: 20px;">नर्सिंग स्टेशन लॉग-इन</h2>
    
    <input type="password" id="passcodeInput" placeholder="पासकोड टाका" style="padding: 12px; font-size: 18px; text-align: center; border-radius: 5px; border: none; margin-bottom: 15px; width: 250px; outline: none; color: black;">
    
    <button onclick="checkPasscode()" style="padding: 12px 20px; font-size: 18px; background-color: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; width: 250px; font-weight: bold;">लॉग-इन करा</button>
    
    <p id="loginError" style="color: #e74c3c; margin-top: 15px; display: none; background-color: white; padding: 5px 10px; border-radius: 4px; font-weight: bold;">❌ चुकीचा पासकोड!</p>
</div>
<div class="container">
<div style="display: flex; align-items: center; justify-content: center; background-color: #2c3e50; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <img src="dhh.png" alt="Hospital Logo" style="height: 50px; width: auto; margin-right: 15px; background-color: white; padding: 3px; border-radius: 4px;">
        <h2 style="margin: 0; color: white; font-size: 24px; font-weight: bold;">Pharmacy Indent</h2>
    </div>
    
    <div class="form-row">
        <div class="form-group">
            <label for="unitName">युनिट (Unit):</label>
            <select id="unitName">
                <option value="BMCCU">BMCCU</option>
                <option value="DHIMSR">DHIMSR</option>
            </select>
        </div>
        <div class="form-group">
            <label for="wardName">वॉर्ड (Ward):</label>
            <select id="wardName">
                <option value="ICU">ICU</option>
                <option value="General Ward">General Ward</option>
                <option value="Emergency">Emergency</option>
                <option value="Private Room">Private Room</option>
                <option value="NICU">NICU</option>
		<option value="OPD">OPD (बाह्यरुग्ण विभाग)</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="patientName">रुग्णाचे नाव (Patient Name):</label>
        <input type="text" id="patientName" placeholder="उदा. रमेश पाटील">
    </div>

    <div class="form-group">
        <label for="prescribedBy">
            डॉक्टरांचे नाव (Prescribed By): <span id="docLoader" class="loading-text">⏳ Loading...</span>
        </label>
        <input type="text" id="prescribedBy" list="doctorList" placeholder="नाव शोधा किंवा टाईप करा...">
        <datalist id="doctorList">
            <option value="Dr. Sharma">
            <option value="Dr. Kulkarni">
        </datalist>
    </div>

    <div class="section-divider"></div>

    <div class="form-row">
        <div class="form-group" style="flex: 2;">
            <label for="medicineName">
                औषध (Medicine / Consumable): <span id="medLoader" class="loading-text">⏳ Loading...</span>
            </label>
            <input type="text" id="medicineName" list="medicineList" placeholder="औषध शोधा किंवा नवीन नाव टाका...">
            <datalist id="medicineList">
                <option value="Paracetamol 500mg-[Paracetamol]">
                <option value="Ceftriaxone 1gm Injection">
            </datalist>
        </div>
        
        <div class="form-group" style="flex: 1;">
            <label for="quantity">संख्या (Qty):</label>
            <input type="number" id="quantity" placeholder="उदा. 10" min="1">
        </div>
    </div>
<div id="opdFields" class="form-row opd-section">
        <div class="form-group" style="flex: 1.5;">
            <label>डोस (Dose):</label>
            <div style="display: flex; gap: 15px; align-items: center; margin-top: 10px;">
                <label><input type="checkbox" id="doseM" class="round-cb"> M (सकाळ)</label>
                <label><input type="checkbox" id="doseA" class="round-cb"> A (दुपार)</label>
                <label><input type="checkbox" id="doseN" class="round-cb"> N (रात्र)</label>
            </div>
        </div>
        <div class="form-group" style="flex: 1;">
            <label for="medDuration">किती दिवस? (Days):</label>
            <input type="number" id="medDuration" placeholder="उदा. 5" min="1">
        </div>
        <div class="form-group" style="flex: 1.5;">
            <label for="medDirection">कधी घ्यायचे? (Direction):</label>
            <select id="medDirection">
                <option value="">-- निवडा --</option>
                <option value="जेवणापूर्वी (Empty Stomach)">जेवणापूर्वी (Empty Stomach)</option>
                <option value="जेवणानंतर (Post Meal)">जेवणानंतर (Post Meal)</option>
                <option value="झोपताना (Bedtime)">झोपताना (Bedtime)</option>
                <option value="गरज पडल्यास (SOS)">गरज पडल्यास (SOS)</option>
            </select>
        </div>
    </div>
    <button class="btn" onclick="addMedicine()">+ लिस्टमध्ये जोडा (Add to List)</button>

    <table id="indentTable">
        <thead>
            <tr>
                <th>औषध</th>
                <th>संख्या</th>
                <th>काढा</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <button class="btn btn-submit" onclick="submitIndent()">✅ फार्मसीला पाठवा (Submit Indent)</button>
    <button id="btnPrint" class="btn-print-nursing" onclick="window.print()">🖨️ प्रिंट काढा (Print Indent)</button>
</div> <div id="printTemplate">
    <table class="print-table">
        <tr>
            <td class="logo-td">
                <img src="dhh.png" style="height: 50px;" alt="Hospital Logo">
            </td>
            <td colspan="3" class="blue-bg" style="font-size: 18px;">
                Dr Hedgewar hospital & Bharani Critical Care Unit
            </td>
        </tr>
        <tr>
            <td class="label">Patient Name:</td>
            <td colspan="3" id="prtPatient"></td>
        </tr>
        <tr>
            <td class="label">Ward:</td>
            <td id="prtWard"></td>
            <td class="label">Date & Time:</td>
            <td id="prtDate"></td>
        </tr>
        <tr>
            <td class="label">Indent No:</td>
            <td colspan="3" id="prtIndentNo">नर्सिंग स्टेशन प्रिंट (Pending)</td>
        </tr>
        <tr>
            <td class="label">Prescribed By:</td>
            <td colspan="3" id="prtDoctor"></td>
        </tr>
        <tr>
            <td colspan="3" class="blue-bg">Medicine/ Consumables</td>
            <td class="blue-bg" style="width: 15%;">Qty</td>
        </tr>
        <tbody id="prtMedicineList">
            </tbody>
    </table>
</div>

<script>
    const LIVE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwkxbyHQMljgU6AaEHj95UH2K5C2RXRdScUOzZrF8PSMuzw2kmLlHaMvrzVMG4dL88I/exec';

    let loggedInUnit = "";
    let indentList = [];

    // Enter की दाबल्यावर लॉग-इन
    document.getElementById('passcodeInput').addEventListener("keypress", function(e) {
        if (e.key === "Enter") checkPasscode();
    });

    // --- १. पासकोड तपासणारी सिस्टीम (Crash-Free Update) ---
    function checkPasscode() {
        const code = document.getElementById('passcodeInput').value.trim();
        const errorMsg = document.getElementById('loginError');
        
        if(!code) return;

        errorMsg.style.display = 'none';
        const timestamp = new Date().getTime(); 

        fetch(LIVE_SCRIPT_URL + "?action=verifyPasscode&code=" + encodeURIComponent(code) + "&t=" + timestamp)
        .then(res => res.json())
        .then(data => {
            if (data.success && data.unit.toLowerCase() !== 'admin' && !data.unit.toLowerCase().includes('pharmacy')) {
                document.getElementById('loginOverlay').style.display = 'none';
                loggedInUnit = data.unit; 
                
                // युनिट बॉक्समध्ये अचूक नाव टाकून ते लॉक करणे
                const unitSelect = document.getElementById('unitName');
                if(![...unitSelect.options].some(opt => opt.value === loggedInUnit)) {
                    let newOpt = document.createElement("option");
                    newOpt.value = loggedInUnit;
                    newOpt.text = loggedInUnit;
                    unitSelect.add(newOpt);
                }
                unitSelect.value = loggedInUnit;
                unitSelect.disabled = true;

                fetchMasterData();
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('passcodeInput').value = '';
            }
        })
        .catch(err => {
            errorMsg.style.display = 'block';
            document.getElementById('passcodeInput').value = '';
        });
    }

    // --- २. मास्टर डेटा ओढणे (Strictly Live Data Only) ---
    function fetchMasterData() {
        const docLoader = document.getElementById('docLoader');
        const medLoader = document.getElementById('medLoader');
        
        if(docLoader) docLoader.style.display = 'inline';
        if(medLoader) medLoader.style.display = 'inline';

        const timestamp = new Date().getTime();

        fetch(LIVE_SCRIPT_URL + "?action=getDropdownData&t=" + timestamp)
            .then(response => response.json())
            .then(data => {
                const wardSelect = document.getElementById('wardName');
                wardSelect.innerHTML = '<option value="">-- वॉर्ड निवडा --</option>'; 
                
                if(data.wards && data.wards.length > 0) {
                    data.wards.forEach(w => {
                        let wName = typeof w === 'object' ? w.name : w;
                        let wUnit = typeof w === 'object' ? w.unit : loggedInUnit;
                        
                        // 🔴 इथे फक्त गुगल शीटचेच वॉर्ड्स येतील. OPD मॅन्युअली ऍड करण्याचा कोड पूर्ण काढून टाकला आहे!
                        if (wUnit === loggedInUnit) {
                            let opt = document.createElement('option');
                            opt.value = wName; 
                            opt.text = wName;
                            wardSelect.appendChild(opt);
                        }
                    });
                }

                populateDatalist('doctorList', data.doctors);
                populateDatalist('medicineList', data.medicines);
                
                if(docLoader) docLoader.style.display = 'none';
                if(medLoader) medLoader.style.display = 'none';
            })
            .catch(error => {
                if(docLoader) docLoader.innerText = "❌ Error";
                if(medLoader) medLoader.innerText = "❌ Error";
            });
    }

    function populateDatalist(listId, itemsArray) {
        const dataList = document.getElementById(listId);
        dataList.innerHTML = ''; 
        if(itemsArray && itemsArray.length > 0) {
            itemsArray.forEach(item => {
                let option = document.createElement('option');
                option.value = item;
                dataList.appendChild(option);
            });
        }
    }

    // --- ३. औषधाचे नाव आणि OPD बॉक्स लॉजिक ---
    document.getElementById('medicineName').addEventListener('input', function(e) {
        let val = e.target.value;
        if (val.includes("[")) { e.target.value = val.split("[")[0].trim().replace(/-$/, "").trim(); }
    }); 

    document.getElementById('wardName').addEventListener('change', function() {
        const opdSection = document.getElementById('opdFields');
        // 🔴 वॉर्डच्या नावात कुठेही "OPD" हा शब्द आला की डोस बॉक्स उघडेल 
        let isOPD = this.value.toUpperCase().includes("OPD");
        opdSection.style.display = isOPD ? 'flex' : 'none';
    });

    // --- ४. औषध लिस्टमध्ये जोडणे ---
    function addMedicine() {
        const medInput = document.getElementById('medicineName').value.trim();
        let qty = document.getElementById('quantity').value.trim();
        const ward = document.getElementById('wardName').value;

        let isOPD = ward.toUpperCase().includes("OPD");

        if(medInput === "") { alert("कृपया औषधाचे नाव टाका."); return; }
        if(!isOPD && qty === "") { alert("कृपया औषधाची संख्या (Qty) टाका."); return; }
        if(isOPD && qty === "") { qty = "-"; }

        let cleanMedicineName = medInput;
        if(medInput.includes("[")) { cleanMedicineName = medInput.split("[")[0].trim().replace(/-$/, "").trim(); }
        let finalMedicineName = cleanMedicineName;

        if (isOPD) {
            let m = document.getElementById('doseM').checked ? "M" : "-";
            let a = document.getElementById('doseA').checked ? "A" : "-";
            let n = document.getElementById('doseN').checked ? "N" : "-";
            let duration = document.getElementById('medDuration').value.trim();
            let direction = document.getElementById('medDirection').value;
            
            let opdDetails = [];
            if (m !== "-" || a !== "-" || n !== "-") opdDetails.push(`Dose: ${m}-${a}-${n}`);
            if (duration !== "") opdDetails.push(`${duration} Days`);
            if (direction !== "") opdDetails.push(direction);
            
            if(opdDetails.length > 0) { finalMedicineName = `${cleanMedicineName} [${opdDetails.join(" | ")}]`; }

            document.getElementById('doseM').checked = false; document.getElementById('doseA').checked = false;
            document.getElementById('doseN').checked = false; document.getElementById('medDuration').value = '';
            document.getElementById('medDirection').value = '';
        }

        indentList.push({ displayName: finalMedicineName, cleanName: finalMedicineName, quantity: qty });
        updateTable();

        document.getElementById('medicineName').value = '';
        document.getElementById('quantity').value = '';
        document.getElementById('medicineName').focus();
    }

    function updateTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        indentList.forEach((item, index) => {
            tbody.innerHTML += `<tr><td>${item.displayName}</td><td>${item.quantity}</td><td class="delete-btn" onclick="removeMedicine(${index})">❌</td></tr>`;
        });
    }

    function removeMedicine(index) { indentList.splice(index, 1); updateTable(); }

    // --- ५. इंडेंट सबमिट करणे ---
    function submitIndent() {
        const ward = document.getElementById('wardName').value;
        const patientName = document.getElementById('patientName').value.trim();
        const prescribedBy = document.getElementById('prescribedBy').value.trim();

        if(ward === "") { alert("कृपया वॉर्ड निवडा."); document.getElementById('wardName').focus(); return; }
        if(patientName === "") { alert("कृपया रुग्णाचे नाव टाका."); document.getElementById('patientName').focus(); return; }
        if(prescribedBy === "") { alert("कृपया डॉक्टरांचे नाव टाका किंवा निवडा."); document.getElementById('prescribedBy').focus(); return; }
        if(indentList.length === 0) { alert("लिस्टमध्ये कोणतेही औषध नाही. कृपया आधी औषधे जोडा."); document.getElementById('medicineName').focus(); return; }
        
        const submitBtn = document.querySelector('.btn-submit');
        submitBtn.innerHTML = "⏳ पाठवत आहे... (Sending...)";
        submitBtn.disabled = true;

        const unitWardCombined = loggedInUnit + " - " + ward;
        const payload = { 
            action: "submitIndent", 
            unitName: loggedInUnit, 
            wardName: unitWardCombined, 
            patientName: patientName, 
            doctorName: prescribedBy, 
            items: indentList.map(item => ({ name: item.displayName, qty: item.quantity })) 
        };

        fetch(LIVE_SCRIPT_URL, {
            method: 'POST', mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            alert("✅ " + patientName + " यांचा Indent यशस्वीरित्या फार्मसीला पाठवला गेला!");
            
            let now = new Date();
            let formattedDate = now.toLocaleString('en-IN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
            
            document.getElementById('prtPatient').innerText = patientName;
            document.getElementById('prtWard').innerText = unitWardCombined;
            document.getElementById('prtDate').innerText = formattedDate;
            document.getElementById('prtDoctor').innerText = prescribedBy;

            const prtBody = document.getElementById('prtMedicineList');
            prtBody.innerHTML = '';
            indentList.forEach(item => {
                let medName = item.displayName; let opdInfo = "";
                if(medName.includes("[")) {
                    let parts = medName.split("["); medName = parts[0].trim();
                    opdInfo = `<br><span style="font-size: 13px; font-weight: normal; color: #555;">[${parts[1]}</span>`;
                }
                prtBody.innerHTML += `<tr><td colspan="3" style="font-weight: bold; border: 1px solid #b2ebf2; padding: 6px;">${medName} ${opdInfo}</td><td style="text-align: center; font-weight: bold; border: 1px solid #b2ebf2; padding: 6px;">${item.quantity}</td></tr>`;
            });

            const btnPrint = document.getElementById('btnPrint');
            if(btnPrint) btnPrint.style.display = 'block';
            
            indentList = []; updateTable();
            document.getElementById('patientName').value = '';
            submitBtn.innerHTML = "✅ फार्मसीला पाठवा (Submit Indent)";
            submitBtn.disabled = false;
        }).catch(error => {
            alert("❌ काहीतरी चूक झाली. कृपया पुन्हा प्रयत्न करा.");
            submitBtn.innerHTML = "✅ फार्मसीला पाठवा (Submit Indent)";
            submitBtn.disabled = false;
        });
    }
</script>
</body>
</html>
