<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation Errorless - Indent Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            flex: 1;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #34495e;
            font-size: 14px;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
        }
        .btn:hover { background-color: #2980b9; }
        .btn-submit {
            background-color: #27ae60;
            margin-top: 20px;
            font-weight: bold;
        }
        .btn-submit:hover { background-color: #2196f3; }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th { background-color: #f2f2f2; }
        .delete-btn {
            color: red;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }
        .section-divider {
            border-top: 1px dashed #ccc;
            margin: 20px 0;
        }
        .loading-text {
            color: #e67e22;
            font-size: 12px;
            font-weight: normal;
            display: none;
        }
        /* A5/A4 Print CSS - Official Template */
        #printTemplate { display: none; }
        @media print {
            body { background-color: white; margin: 0; padding: 0; }
            .container { display: none !important; }
            #printTemplate { display: block !important; width: 100%; font-family: Arial, sans-serif; }
            
            .print-table { width: 100%; border-collapse: collapse; font-size: 14px; }
            .print-table td { border: 1px solid #b2ebf2; padding: 6px; }
            .print-table .label { font-weight: bold; background-color: #f4f4f4; width: 20%; -webkit-print-color-adjust: exact; }
            .print-table .blue-bg { 
                background-color: #4a86e8 !important; 
                color: white !important; 
                font-weight: bold; 
                text-align: center;
                -webkit-print-color-adjust: exact; 
                color-adjust: exact;
            }
            .print-table .logo-td { width: 25%; text-align: center; padding: 5px; border: 1px solid #4a86e8;}
            
            @page { margin: 10mm; }
        }
        
        /* नवीन प्रिंट बटणासाठी स्टाईल */
        .btn-print-nursing {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            display: none; /* सुरुवातीला लपवलेले असेल */
        }
        .btn-print-nursing:hover { background-color: #d68910; }
    </style>
</head>
<body onload="fetchMasterData()">
<div class="container">
<div style="display: flex; align-items: center; justify-content: center; background-color: #2c3e50; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <img src="dhh.png" alt="Hospital Logo" style="height: 50px; width: auto; margin-right: 15px; background-color: white; padding: 3px; border-radius: 4px;">
        <h2 style="margin: 0; color: white; font-size: 24px; font-weight: bold;">Pharmacy Indent</h2>
    </div>
    
    <div class="form-row">
        <div class="form-group">
            <label for="unitName">युनिट (Unit):</label>
            <select id="unitName">
                <option value="BMCCU">BMCCU</option>
                <option value="DHIMSR">DHIMSR</option>
            </select>
        </div>
        <div class="form-group">
            <label for="wardName">वॉर्ड (Ward):</label>
            <select id="wardName">
                <option value="ICU">ICU</option>
                <option value="General Ward">General Ward</option>
                <option value="Emergency">Emergency</option>
                <option value="Private Room">Private Room</option>
                <option value="NICU">NICU</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="patientName">रुग्णाचे नाव (Patient Name):</label>
        <input type="text" id="patientName" placeholder="उदा. रमेश पाटील">
    </div>

    <div class="form-group">
        <label for="prescribedBy">
            डॉक्टरांचे नाव (Prescribed By): <span id="docLoader" class="loading-text">⏳ Loading...</span>
        </label>
        <input type="text" id="prescribedBy" list="doctorList" placeholder="नाव शोधा किंवा टाईप करा...">
        <datalist id="doctorList">
            <option value="Dr. Sharma">
            <option value="Dr. Kulkarni">
        </datalist>
    </div>

    <div class="section-divider"></div>

    <div class="form-row">
        <div class="form-group" style="flex: 2;">
            <label for="medicineName">
                औषध (Medicine / Consumable): <span id="medLoader" class="loading-text">⏳ Loading...</span>
            </label>
            <input type="text" id="medicineName" list="medicineList" placeholder="औषध शोधा किंवा नवीन नाव टाका...">
            <datalist id="medicineList">
                <option value="Paracetamol 500mg-[Paracetamol]">
                <option value="Ceftriaxone 1gm Injection">
            </datalist>
        </div>
        
        <div class="form-group" style="flex: 1;">
            <label for="quantity">संख्या (Qty):</label>
            <input type="number" id="quantity" placeholder="उदा. 10" min="1">
        </div>
    </div>

    <button class="btn" onclick="addMedicine()">+ लिस्टमध्ये जोडा (Add to List)</button>

    <table id="indentTable">
        <thead>
            <tr>
                <th>औषध</th>
                <th>संख्या</th>
                <th>काढा</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <button class="btn btn-submit" onclick="submitIndent()">✅ फार्मसीला पाठवा (Submit Indent)</button>
    <button id="btnPrint" class="btn-print-nursing" onclick="window.print()">🖨️ प्रिंट काढा (Print Indent)</button>
</div> <div id="printTemplate">
    <table class="print-table">
        <tr>
            <td class="logo-td">
                <img src="dhh.png" style="height: 50px;">
            </td>
            <td colspan="3" class="blue-bg" style="font-size: 18px;">
                Dr Hedgewar hospital & Bharani Critical Care Unit
            </td>
        </tr>
        <tr>
            <td class="label">Patient Name:</td>
            <td colspan="3" id="prtPatient"></td>
        </tr>
        <tr>
            <td class="label">Ward:</td>
            <td id="prtWard"></td>
            <td class="label">Date & Time:</td>
            <td id="prtDate"></td>
        </tr>
        <tr>
            <td class="label">Indent No:</td>
            <td colspan="3" id="prtIndentNo">नर्सिंग स्टेशन प्रिंट (Pending)</td>
        </tr>
        <tr>
            <td class="label">Prescribed By:</td>
            <td colspan="3" id="prtDoctor"></td>
        </tr>
        <tr>
            <td colspan="3" class="blue-bg">Medicine/ Consumables</td>
            <td class="blue-bg" style="width: 15%;">Qty</td>
        </tr>
        <tbody id="prtMedicineList">
            </tbody>
    </table>
</div>

<script>
    let indentList = [];
document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('medicineName').addEventListener('input', function(e) {
            let val = e.target.value;
            if (val.includes("[")) {
                // आधी स्पेस काढेल, मग डॅश काढेल आणि एकदम क्लीन नाव देईल
                e.target.value = val.split("[")[0].trim().replace(/-$/, "").trim();
            }
        });
    });
    // १. मास्टर डेटा गुगल शीटमधून ओढणे (Doctors & Medicines)
    function fetchMasterData() {
        document.getElementById('docLoader').style.display = 'inline';
        document.getElementById('medLoader').style.display = 'inline';

        // 🔴 इथे तुमची Apps Script ची URL टाका 🔴
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzymM_BdjSLBvGuwwVDWk04P31MRV8jLa50nDpNWnnsdRGLva6IVjmEA0xxnAz4ywYS/exec?action=getDropdownData'; 
        
        fetch(scriptURL)
            .then(response => response.json())
            .then(data => {
                populateDatalist('doctorList', data.doctors);
                populateDatalist('medicineList', data.medicines);
                document.getElementById('docLoader').style.display = 'none';
                document.getElementById('medLoader').style.display = 'none';
            })
            .catch(error => {
                console.error("Data Fetch Error: ", error);
                document.getElementById('docLoader').innerText = "❌ Error";
                document.getElementById('medLoader').innerText = "❌ Error";
            });
    }

    function populateDatalist(listId, itemsArray) {
        const dataList = document.getElementById(listId);
        dataList.innerHTML = ''; 
        itemsArray.forEach(item => {
            let option = document.createElement('option');
            option.value = item;
            dataList.appendChild(option);
        });
    }

function addMedicine() {
        const medInput = document.getElementById('medicineName').value.trim();
        const qty = document.getElementById('quantity').value.trim();

        if(medInput === "" || qty === "") {
            alert("कृपया औषधाचे नाव आणि संख्या दोन्ही टाका.");
            return;
        }

        // नाव क्लीन करणे
        let cleanMedicineName = medInput;
        if(medInput.includes("[")) {
            // इथेही तोच अचूक फॉर्म्युला
            cleanMedicineName = medInput.split("[")[0].trim().replace(/-$/, "").trim();
        }

        // --- इथे बदल केला आहे (displayName मध्ये cleanMedicineName टाकले) ---
        indentList.push({ 
            displayName: cleanMedicineName, 
            cleanName: cleanMedicineName, 
            quantity: qty 
        });
        
        updateTable();

        // बॉक्स रिकामा करणे
        document.getElementById('medicineName').value = '';
        document.getElementById('quantity').value = '';
        document.getElementById('medicineName').focus();
    }

    function updateTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 

        indentList.forEach((item, index) => {
            let row = `<tr>
                <td>${item.displayName}</td>
                <td>${item.quantity}</td>
                <td class="delete-btn" onclick="removeMedicine(${index})">❌</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    function removeMedicine(index) {
        indentList.splice(index, 1);
        updateTable();
    }

    function submitIndent() {
        const unit = document.getElementById('unitName').value;
        const ward = document.getElementById('wardName').value;
        const patientName = document.getElementById('patientName').value.trim();
        const prescribedBy = document.getElementById('prescribedBy').value.trim();

        if(patientName === "") {
            alert("कृपया रुग्णाचे नाव टाका.");
            document.getElementById('patientName').focus();
            return;
        }
        if(prescribedBy === "") {
            alert("कृपया डॉक्टरांचे नाव टाका किंवा निवडा.");
            document.getElementById('prescribedBy').focus();
            return;
        }
        if(indentList.length === 0) {
            alert("लिस्टमध्ये कोणतेही औषध नाही. कृपया आधी औषधे जोडा.");
            document.getElementById('medicineName').focus();
            return;
        }
        
        const submitBtn = document.querySelector('.btn-submit');
        submitBtn.innerHTML = "⏳ पाठवत आहे... (Sending...)";
        submitBtn.disabled = true;

        const unitWardCombined = unit + " - " + ward;

        const payload = {
            unitWard: unitWardCombined,
            patientName: patientName,
            prescribedBy: prescribedBy,
            items: indentList 
        };

        // 🔴 इथे तुमची Apps Script ची URL पुन्हा टाका 🔴
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzymM_BdjSLBvGuwwVDWk04P31MRV8jLa50nDpNWnnsdRGLva6IVjmEA0xxnAz4ywYS/exec'; 

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert("✅ " + patientName + " यांचा Indent यशस्वीरित्या फार्मसीला पाठवला गेला!");
            
            indentList = [];
            updateTable();
            document.getElementById('patientName').value = '';
            // prescribedBy क्लियर करत नाहीयोत, कारण एकाच डॉक्टरचे एकामागोमाग पेशंट असू शकतात.
            submitBtn.innerHTML = "✅ फार्मसीला पाठवा (Submit Indent)";
            submitBtn.disabled = false;
        })
        .catch(error => {
            console.error('Error!', error);
            alert("❌ काहीतरी चूक झाली. कृपया पुन्हा प्रयत्न करा.");
            submitBtn.innerHTML = "✅ फार्मसीला पाठवा (Submit Indent)";
            submitBtn.disabled = false;
        });
    }
</script>

</body>
</html>
