<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Dashboard - Operation Errorless</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f0f2f5;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Header */
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            width: 100%;
            position: fixed;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }
        .header h2 { margin: 0; font-size: 20px; }
        .refresh-btn {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .refresh-btn:hover { background-color: #d35400; }

        /* Main Layout */
        .main-container {
            display: flex;
            width: 100%;
            margin-top: 60px; /* Space for header */
            height: calc(100vh - 60px);
        }

        /* Left Panel - Pending Indents */
        .left-panel {
            width: 35%;
            background-color: #ffffff;
            border-right: 2px solid #ddd;
            overflow-y: auto;
            padding: 15px;
        }
        .left-panel h3 {
            margin-top: 0;
            color: #e74c3c;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .indent-card {
            background-color: #fdfefe;
            border: 1px solid #dcdde1;
            border-left: 5px solid #3498db;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .indent-card:hover, .indent-card.active {
            background-color: #ebf5fb;
            border-color: #3498db;
        }
        .indent-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 16px; /* अक्षर थोडे मोठे केले */
            margin-bottom: 5px;
            color: #2c3e50;
        }
        .indent-details { 
            font-size: 14.5px; /* अक्षर थोडे मोठे केले */
            color: #555; 
            line-height: 1.4;
        }
        
        /* ड्रॉपडाऊन डिझाईन */
        .branch-filter {
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
            font-weight: bold;
            color: #2c3e50;
            outline: none;
            cursor: pointer;
        }
        .details-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            display: none; /* सुरुवातीला लपवलेले असेल */
        }
        .action-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }
        .btn-print {
            background-color: transparent;
            color: #3498db;
            border: 2px solid #3498db;
            border-radius: 50%; /* गोल बटणासाठी */
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-print:hover { 
            background-color: #3498db; 
            color: white;
        }
        }
        .btn-dispatch:hover { background-color: #2196f3; }

        .patient-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
        }
        .info-group { margin: 0; font-size: 14px; }
        .info-group strong { color: #2c3e50; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
            font-size: 14px;
        }
        th { background-color: #34495e; color: white; }

        .placeholder-text {
            text-align: center;
            color: #999;
            margin-top: 20%;
            font-size: 18px;
        }

        /* A5 Print CSS (फक्त प्रिंट काढताना हे ॲक्टिव्ह होईल) */
        @media print {
            body { background-color: white; }
            .header, .left-panel, .action-bar { display: none !important; }
            .main-container { margin: 0; height: auto; display: block; }
            .right-panel { width: 100%; padding: 0; background: white; }
            .details-container { box-shadow: none; display: block; }
            @page { size: A5; margin: 10mm; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🏥 Pharmacy Dashboard</h2>
        <button class="refresh-btn" onclick="fetchPendingIndents()">🔄 Refresh List</button>
    </div>

    <div class="main-container">
        
        <div class="left-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">
                <h3 style="margin: 0; color: #e74c3c; border: none; padding: 0;">⏳ Pending Indents</h3>
                <select id="branchFilter" class="branch-filter" onchange="filterIndents()">
                    <option value="All">All Units</option>
                    <option value="BMCCU">BMCCU</option>
                    <option value="DHIMSR">DHIMSR</option>
                </select>
            </div>
            
            <div id="indentListContainer">
                <p style="text-align:center; color:#7f8c8d; margin-top:20px;">लोड करत आहे... (Loading...)</p>
            </div>
        </div>

        <div class="right-panel">
            
            <div id="placeholder" class="placeholder-text">
                👈 डावीकडील लिस्ट मधून एक इंडेंट निवडा.
            </div>

            <div id="detailsContainer" class="details-container">
                <div class="action-bar">
                    <button class="btn-print" onclick="window.print()" title="Print Indent">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18 3H6v4h12V3zM19 9H5c-1.1 0-2 .9-2 2v6h4v4h10v-4h4v-6c0-1.1-.9-2-2-2zm-3 9H8v-5h8v5zm3-4.5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
                        </svg>
                    </button>
                    <button class="btn-dispatch" onclick="markAsDispatched()">✅ Mark as Dispatched</button>
                </div>

                <div class="patient-info">
                    <div class="info-group"><strong>Indent No:</strong> <span id="lblIndentNo"></span></div>
                    <div class="info-group"><strong>Date Time:</strong> <span id="lblDate"></span></div>
                    <div class="info-group"><strong>Unit/Ward:</strong> <span id="lblWard"></span></div>
                    <div class="info-group"><strong>Patient Name:</strong> <span id="lblPatient"></span></div>
                    <div class="info-group" style="grid-column: span 2;"><strong>Prescribed By:</strong> <span id="lblDoctor"></span></div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Sr. No.</th>
                            <th>Medicine / Consumable</th>
                            <th>Quantity</th>
                        </tr>
                    </thead>
                    <tbody id="medicineTableBody">
                        </tbody>
                </table>
            </div>
        </div>

    </div>

<script>
    // डेमो डेटा (गुगल शीट कनेक्ट करण्यापूर्वी डिझाईन तपासण्यासाठी)
    const dummyData = [
        {
            indentNo: "IND-260605162709",
            date: "05/06/2026 16:27",
            ward: "BMCCU - ICU",
            patientName: "TEST",
            doctor: "Dr. Ankit Ambad",
            medicines: [
                { name: "DIFIDOX INJ", qty: 1 }
            ]
        },
        {
            indentNo: "IND-260605172855",
            date: "05/06/2026 17:28",
            ward: "DHIMSR - Emergency",
            patientName: "VAIBHAV",
            doctor: "Dr. Sharma",
            medicines: [
                { name: "DIFIDOX INJ", qty: 5 },
                { name: "PARACETAMOL 500MG TAB", qty: 10 }
            ]
        }
    ];

    let currentSelectedIndent = null;

    // पेज लोड झाल्यावर लिस्ट दाखवण्यासाठी
    let currentSelectedIndent = null;
    let allIndents = []; // सर्व इंडेंट्स इथे सेव्ह राहतील

    // पेज लोड झाल्यावर
    window.onload = function() {
        allIndents = dummyData; // नंतर आपण इथे Google Sheet चा डेटा टाकू
        filterIndents(); // सुरुवातीला सर्व डेटा दाखवण्यासाठी
    };

    // ड्रॉपडाऊनमधून युनिट निवडल्यावर लिस्ट फिल्टर करण्यासाठी
    function filterIndents() {
        const selectedBranch = document.getElementById('branchFilter').value;
        let filteredData = allIndents;

        // जर All निवडले नसेल, तर फक्त निवडलेल्या युनिटचा डेटा वेगळा करणे
        if (selectedBranch !== "All") {
            filteredData = allIndents.filter(indent => indent.ward.includes(selectedBranch));
        }

        renderIndentList(filteredData);
        
        // युनिट बदलल्यावर उजव्या बाजूचे पॅनेल रिसेट करणे
        document.getElementById('detailsContainer').style.display = 'none';
        document.getElementById('placeholder').style.display = 'block';
        currentSelectedIndent = null;
    }
        indents.forEach((indent, index) => {
            const card = document.createElement('div');
            card.className = 'indent-card';
            card.innerHTML = `
                <div class="indent-header">
                    <span>${indent.indentNo}</span>
                    <span style="color:#e67e22;">${indent.date.split(' ')[1]}</span>
                </div>
                <div class="indent-details">
                    <strong>${indent.patientName}</strong> (${indent.ward})<br>
                    Dr: ${indent.doctor}
                </div>
            `;
            
            // कार्डवर क्लिक केल्यावर डिटेल्स उजवीकडे दाखवणे
            card.onclick = function() {
                // Remove active class from all cards
                document.querySelectorAll('.indent-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                showIndentDetails(indent);
            };

            container.appendChild(card);
        });
    }

    function showIndentDetails(indent) {
        currentSelectedIndent = indent.indentNo;

        // Hide placeholder, show details
        document.getElementById('placeholder').style.display = 'none';
        document.getElementById('detailsContainer').style.display = 'block';

        // Set Labels
        document.getElementById('lblIndentNo').innerText = indent.indentNo;
        document.getElementById('lblDate').innerText = indent.date;
        document.getElementById('lblWard').innerText = indent.ward;
        document.getElementById('lblPatient').innerText = indent.patientName;
        document.getElementById('lblDoctor').innerText = indent.doctor;

        // Populate Table
        const tbody = document.getElementById('medicineTableBody');
        tbody.innerHTML = '';
        indent.medicines.forEach((med, index) => {
            tbody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td><b>${med.name}</b></td>
                    <td>${med.qty}</td>
                </tr>
            `;
        });
    }

    function markAsDispatched() {
        if(!currentSelectedIndent) return;
        
        // इथे आपण नंतर गुगल शीटला अपडेट करण्यासाठी API कॉल करू
        alert(currentSelectedIndent + " यशस्वीरित्या Dispatched मार्क झाला! (Test Mode)");
        
        // डिस्पॅच झाल्यावर डॅशबोर्ड रिसेट करणे
        document.getElementById('detailsContainer').style.display = 'none';
        document.getElementById('placeholder').style.display = 'block';
        currentSelectedIndent = null;
        
        // लिस्ट रिफ्रेश करू
        // fetchPendingIndents();
    }

    function fetchPendingIndents() {
        // हे फंक्शन आपण गुगल शीटशी कनेक्ट करताना अपडेट करू
        alert("गुगल शीटमधून नवीन इंडेंट्स लोड करत आहे...");
    }
</script>

</body>
</html>
