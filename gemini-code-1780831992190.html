<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Controller - Operation Errorless</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; background-color: #f4f6f9; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background-color: #343a40; color: white; padding: 20px 15px; display: flex; flex-direction: column; }
        .sidebar h2 { text-align: center; color: #f39c12; font-size: 20px; margin-bottom: 30px; border-bottom: 1px solid #4f5962; padding-bottom: 15px; }
        .menu-btn { background: none; border: none; color: #c2c7d0; text-align: left; padding: 12px 15px; font-size: 16px; margin-bottom: 10px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .menu-btn:hover, .menu-btn.active { background-color: #007bff; color: white; font-weight: bold; }
        .content { flex: 1; padding: 30px; overflow-y: auto; }
        .tab-section { display: none; }
        .tab-section.active { display: block; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border-top: 4px solid #3498db; }
        h3 { margin-top: 0; color: #2c3e50; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 150px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { background-color: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:hover { background-color: #2196f3; }
        .btn-pdf { background-color: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-pdf:hover { background-color: #c0392b; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; color: #333; }
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .bg-active { background-color: #d4edda; color: #155724; }
        .bg-inactive { background-color: #f8d7da; color: #721c24; }
        /* Toggle Switch CSS */
        .switch { position: relative; display: inline-block; width: 54px; height: 26px; margin: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #e0e0e0; transition: .4s; border-radius: 26px; }
        .slider:before { position: absolute; content: "|||"; color: #ccc; font-size: 8px; display: flex; align-items: center; justify-content: center; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #27ae60; }
        input:checked + .slider:before { transform: translateX(28px); color: #27ae60; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>⚙️ Admin Controller</h2>
        <button class="menu-btn active" onclick="switchTab('analyticsTab', this)">📊 Analytics & Graph</button>
        <button class="menu-btn" onclick="switchTab('searchTab', this)">🔍 Search Indents</button>
        <button class="menu-btn" onclick="switchTab('settingsTab', this)">🛠️ Master Settings</button>
    </div>

    <div class="content">
        <div id="analyticsTab" class="tab-section active">
            <div class="card" style="border-top-color: #9b59b6;">
                <h3>📉 Interactive Pharmacy Analytics</h3>
                <div class="form-row" style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                    <div class="form-group"><label>Start Date:</label><input type="date" id="chartStart"></div>
                    <div class="form-group"><label>End Date:</label><input type="date" id="chartEnd"></div>
                    <div class="form-group"><label>Unit / Ward:</label><select id="chartWard"><option value="All">All Wards</option></select></div>
                    <div class="form-group"><label>Graph Type:</label><select id="chartType"><option value="daywise">Day-wise Average</option><option value="indentwise">Indent-wise Details</option></select></div>
                    <div class="form-group" style="display: flex; align-items: flex-end;"><button class="btn" style="width: 100%;" onclick="renderChart()">Apply Filters</button></div>
                </div>
                <div style="height: 350px; width: 100%;"><canvas id="responseChart"></canvas></div>
            </div>
        </div>

        <div id="searchTab" class="tab-section">
            <div class="card" style="border-top-color: #3498db;">
                <h3>🔍 Smart Indent Search</h3>
                <div class="form-row" style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                    <div class="form-group"><label>From Date:</label><input type="date" id="searchFrom"></div>
                    <div class="form-group"><label>To Date:</label><input type="date" id="searchTo"></div>
                    <div class="form-group"><label>Patient Name:</label><input type="text" id="searchPatient" placeholder="नाव टाका..."></div>
                    <div class="form-group"><label>Indent No:</label><input type="text" id="searchIndentNo" placeholder="उदा. IND-..."></div>
                    <div class="form-group" style="display: flex; align-items: flex-end;"><button class="btn" style="width: 100%; background-color: #2980b9;" onclick="searchIndents()">शोधा (Search)</button></div>
                </div>
                <table>
                    <thead>
                        <tr><th>Date</th><th>Indent No</th><th>Patient Name</th><th>Ward</th><th>Status</th><th>PRT</th><th>Action</th></tr>
                    </thead>
                    <tbody id="searchResults">
                        <tr><td colspan="7" style="text-align: center; color: #999;">डेटा शोधण्यासाठी वरील फिल्टर्स वापरा.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="settingsTab" class="tab-section">
            <div class="form-row">
                <div class="form-group card" style="border-top-color: #e67e22;">
                    <h3>🔐 Passcodes (पासकोड)</h3>
                    <table id="passcodeTable"></table>
                </div>
                
                <div class="form-group card" style="border-top-color: #2ecc71;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <h3 style="margin: 0;">🏥 Wards</h3>
                        <select id="wardUnitFilter" onchange="renderWardsTable()" style="width: auto; padding: 5px 10px; font-weight: bold; border-radius: 4px;">
                            <option value="All">All Units</option>
                        </select>
                    </div>
                    
                    <table id="wardTable"></table>
                    
                    <button id="addWardBtn" class="btn" style="margin-top: 15px; width: 100%; background-color: #34495e;" onclick="showAddWardForm()">+ Add New Ward</button>

                    <div id="addWardFormDiv" style="display:none; margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px; border: 1px dashed #2ecc71;">
                        <h4 style="margin-top: 0; margin-bottom: 10px; color: #27ae60;">नवीन वॉर्ड जोडा</h4>
                        <div class="form-row" style="margin-bottom: 10px;">
                            <div class="form-group">
                                <label style="font-size: 12px; font-weight: bold;">Select Unit:</label>
                                <select id="newWardUnitSelect"></select>
                            </div>
                            <div class="form-group">
                                <label style="font-size: 12px; font-weight: bold;">Ward Name:</label>
                                <input type="text" id="newWardNameInput" placeholder="उदा. ICU, General">
                            </div>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <button class="btn" style="width: 50%;" onclick="submitNewWard()">Save</button>
                            <button class="btn" style="width: 50%; background-color: #e74c3c;" onclick="hideAddWardForm()">Cancel</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
    // 🔴 तुमची Beta Script URL इथे टाका
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwkxbyHQMljgU6AaEHj95UH2K5C2RXRdScUOzZrF8PSMuzw2kmLlHaMvrzVMG4dL88I/exec';
    
    let allIndentsData = [];
    let myChart = null;

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-section').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    window.onload = function() {
        document.getElementById('searchResults').innerHTML = '<tr><td colspan="7" style="text-align:center; color:#e67e22;">⏳ डेटा लोड होत आहे...</td></tr>';
        fetch(SCRIPT_URL + "?action=getAdminDashboardData")
            .then(res => res.json())
            .then(data => {
                allIndentsData = data.indents;
                populateWardDropdown(data.settings.wards);
                renderSettings(data.settings);
                renderChart(); 
                searchIndents(); 
            }).catch(err => alert("डेटा लोड करताना एरर आला."));
    };

    function populateWardDropdown(wards) {
        let sel = document.getElementById('chartWard');
        wards.forEach(w => sel.innerHTML += `<option value="${w.name}">${w.name}</option>`);
    }

    // --- 📅 Date Helper Function ---
    function parseDateStr(dateStr) {
        if(!dateStr) return new Date(0);
        let parts = dateStr.split(" ")[0].split("/");
        return new Date(parts[2], parts[1]-1, parts[0]);
    }

    // --- 📊 Interactive Chart Logic ---
    function renderChart() {
        let start = document.getElementById('chartStart').value ? new Date(document.getElementById('chartStart').value) : null;
        let end = document.getElementById('chartEnd').value ? new Date(document.getElementById('chartEnd').value) : null;
        let wardFilter = document.getElementById('chartWard').value;
        let chartType = document.getElementById('chartType').value;

        let filtered = allIndentsData.filter(ind => ind.status === "Dispatched" && ind.responseTime !== "");
        if(start) filtered = filtered.filter(ind => parseDateStr(ind.dateStr) >= start);
        if(end) filtered = filtered.filter(ind => parseDateStr(ind.dateStr) <= end);
        if(wardFilter !== "All") filtered = filtered.filter(ind => ind.ward === wardFilter);

        let labels = []; let dataPoints = []; let chartLabel = ""; let chartTypeJS = "line";

        if(chartType === "daywise") {
            chartLabel = "Daily Avg PRT (Mins)";
            chartTypeJS = "line";
            let daily = {};
            filtered.forEach(ind => {
                let dStr = ind.dateStr.split(" ")[0]; 
                if(!daily[dStr]) daily[dStr] = { sum: 0, count: 0 };
                daily[dStr].sum += parseInt(ind.responseTime);
                daily[dStr].count++;
            });
            for(let key in daily) {
                labels.push(key);
                dataPoints.push(Math.round(daily[key].sum / daily[key].count));
            }
        } else {
            chartLabel = "Indent PRT (Mins)";
            chartTypeJS = "bar";
            filtered.forEach(ind => {
                labels.push(ind.indentNo.replace("IND-", ""));
                dataPoints.push(parseInt(ind.responseTime));
            });
        }

        const ctx = document.getElementById('responseChart').getContext('2d');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: chartTypeJS,
            data: {
                labels: labels.length ? labels : ['No Data'],
                datasets: [{
                    label: chartLabel, data: dataPoints.length ? dataPoints : [0],
                    borderColor: '#9b59b6', backgroundColor: chartTypeJS === 'bar' ? '#3498db' : 'rgba(155, 89, 182, 0.2)',
                    borderWidth: 2, fill: true, tension: 0.3
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    // --- 🔍 Search & Table Logic ---
    function searchIndents() {
        let fromD = document.getElementById('searchFrom').value ? new Date(document.getElementById('searchFrom').value) : null;
        let toD = document.getElementById('searchTo').value ? new Date(document.getElementById('searchTo').value) : null;
        let pat = document.getElementById('searchPatient').value.toLowerCase();
        let indNo = document.getElementById('searchIndentNo').value.toLowerCase();

        let filtered = allIndentsData;
        if(fromD) filtered = filtered.filter(ind => parseDateStr(ind.dateStr) >= fromD);
        if(toD) filtered = filtered.filter(ind => parseDateStr(ind.dateStr) <= toD);
        if(pat) filtered = filtered.filter(ind => ind.patient.toLowerCase().includes(pat));
        if(indNo) filtered = filtered.filter(ind => ind.indentNo.toLowerCase().includes(indNo));

        const tbody = document.getElementById('searchResults');
        tbody.innerHTML = '';
        if(filtered.length === 0) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">डेटा सापडला नाही.</td></tr>'; return; }

        filtered.slice().reverse().forEach(ind => {
            let sc = ind.status === 'Pending' ? 'color:#e67e22;' : 'color:#27ae60;';
            let prt = ind.responseTime ? ind.responseTime + " m" : "-";
            tbody.innerHTML += `<tr>
                <td style="font-size:13px;">${ind.dateStr}</td>
                <td><b>${ind.indentNo}</b></td>
                <td>${ind.patient}</td><td>${ind.ward}</td>
                <td style="${sc} font-weight:bold;">${ind.status}</td>
                <td style="text-align:center;"><b>${prt}</b></td>
                <td><button class="btn-pdf" onclick="generatePDF('${ind.indentNo}')">📄 View PDF</button></td>
            </tr>`;
        });
    }

    // --- 🖨️ PDF Print Logic ---
    function generatePDF(indentNo) {
        let indent = allIndentsData.find(i => i.indentNo === indentNo);
        if(!indent) return;

        let itemRows = "";
        indent.items.forEach((item, index) => {
            itemRows += `<tr><td style="border:1px solid #000; padding:5px; text-align:center;">${index+1}</td><td style="border:1px solid #000; padding:5px;">${item.name}</td><td style="border:1px solid #000; padding:5px; text-align:center;">${item.qty}</td></tr>`;
        });

        let printWindow = window.open('', '', 'width=800,height=600');
        printWindow.document.write(`
            <html><head><title>Print Indent - ${indent.indentNo}</title></head>
            <body style="font-family: Arial, sans-serif; padding: 20px;">
                <h2 style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px;">Operation Errorless - Pharmacy Indent</h2>
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 14px;">
                    <div><b>Indent No:</b> ${indent.indentNo}<br><b>Patient Name:</b> ${indent.patient}</div>
                    <div><b>Date:</b> ${indent.dateStr}<br><b>Ward:</b> ${indent.ward}</div>
                </div>
                <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
                    <thead><tr><th style="border:1px solid #000; padding:5px; background:#f0f0f0;">Sr No</th><th style="border:1px solid #000; padding:5px; background:#f0f0f0;">Medicine Name</th><th style="border:1px solid #000; padding:5px; background:#f0f0f0;">Quantity</th></tr></thead>
                    <tbody>${itemRows}</tbody>
                </table>
                <div style="margin-top: 40px; display: flex; justify-content: space-between;">
                    <div><b>Ordered By:</b> Nursing Station</div>
                    <div><b>Status:</b> ${indent.status}</div>
                </div>
                <script>window.onload = function() { window.print(); window.close(); }<\/script>
            </body></html>
        `);
    }

    // --- Settings Tab Functions ---
    let globalWardsData = []; 

    function renderSettings(sData) {
        globalWardsData = sData.wards; 

        // १. पासकोड टेबल
        let pHTML = '<tr><th>Unit</th><th>Passcode</th></tr>';
        let unitDropdownHTML = '<option value="All">All Units</option>';
        let newWardUnitHTML = '';

        sData.passcodes.forEach(p => {
            pHTML += `<tr>
                <td><b>${p.unit}</b></td>
                <td style="display: flex; align-items: center; justify-content: space-between;">
                    <span style="letter-spacing: 4px; font-size: 18px; color: #555;">••••</span>
                    <button style="color:#e67e22; border:none; background:none; cursor:pointer; font-size:16px;" onclick="editPasscode('${p.unit}')" title="Edit Passcode">✏️</button>
                </td>
            </tr>`;
            
            if(p.unit.toLowerCase() !== 'admin') {
                unitDropdownHTML += `<option value="${p.unit}">${p.unit}</option>`;
                newWardUnitHTML += `<option value="${p.unit}">${p.unit}</option>`;
            }
        });
        
        document.getElementById('passcodeTable').innerHTML = pHTML;
        document.getElementById('wardUnitFilter').innerHTML = unitDropdownHTML;
        document.getElementById('newWardUnitSelect').innerHTML = newWardUnitHTML;

        // २. वॉर्ड्स टेबल रेंडर
        renderWardsTable();
    }

    // अचूक युनिटनुसार वॉर्ड्स फिल्टर
    function renderWardsTable() {
        let selectedUnit = document.getElementById('wardUnitFilter').value;
        let filteredWards = globalWardsData;

        if (selectedUnit !== "All") {
            filteredWards = globalWardsData.filter(w => w.unit === selectedUnit);
        }

        let wHTML = '<tr><th>Ward Name</th><th>Status</th><th>Action</th></tr>';
        
        if (filteredWards.length === 0) {
            wHTML += `<tr><td colspan="3" style="text-align:center; color:#999;">या युनिटमध्ये वॉर्ड्स नाहीत.</td></tr>`;
        } else {
            filteredWards.forEach(w => {
                let active = w.status.toLowerCase() === 'active';
                wHTML += `<tr>
                    <td>${w.name}</td>
                    <td><span class="status-badge ${active ? 'bg-active' : 'bg-inactive'}">${w.status}</span></td>
                    <td><label class="switch"><input type="checkbox" ${active ? 'checked' : ''} onchange="toggleWardStatus('${w.unit}', '${w.name}', ${active})"><span class="slider"></span></label></td>
                </tr>`;
            });
        }
        document.getElementById('wardTable').innerHTML = wHTML;
    }

    // --- 🔴 Missing Functions Added Here ---

    // टॉगल स्विचवर क्लिक केल्यावर खऱ्या गुगल शीटमध्ये बदल करणारे फंक्शन
    function toggleWardStatus(unit, ward, isActive) {
        let payload = { action: "toggleWardStatus", unitName: unit, wardName: ward, newStatus: isActive ? "Inactive" : "Active" };
        
        document.getElementById('wardTable').style.opacity = '0.5';

        fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(response => response.json())
        .then(data => {
            setTimeout(() => location.reload(), 800); 
        })
        .catch(error => {
            console.error('Error!', error);
            alert("❌ स्टेटस बदलताना एरर आला. कृपया पुन्हा प्रयत्न करा.");
            location.reload(); 
        });
    }

    // नवीन पासकोड विचारणारे आणि शीटमध्ये सेव्ह करणारे फंक्शन
    function editPasscode(unitName) {
        let newPasscode = prompt(unitName + " साठी नवीन पासकोड टाका:");

        if (newPasscode !== null && newPasscode.trim() !== "") {
            const payload = { action: "updatePasscode", unitName: unitName, newPasscode: newPasscode.trim() };

            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
            .then(response => response.json())
            .then(data => {
                alert("✅ " + unitName + " चा पासकोड यशस्वीरित्या बदलला!");
                setTimeout(() => location.reload(), 800); 
            })
            .catch(error => {
                console.error('Error!', error);
                alert("❌ पासकोड बदलताना एरर आला. कृपया पुन्हा प्रयत्न करा.");
            });
        }
    }

    // --- Add Ward Form Logic ---
    function showAddWardForm() {
        document.getElementById('addWardBtn').style.display = 'none';
        document.getElementById('addWardFormDiv').style.display = 'block';
    }

    function hideAddWardForm() {
        document.getElementById('addWardBtn').style.display = 'block';
        document.getElementById('addWardFormDiv').style.display = 'none';
        document.getElementById('newWardNameInput').value = '';
    }

    function submitNewWard() {
        let uName = document.getElementById('newWardUnitSelect').value;
        let wName = document.getElementById('newWardNameInput').value.trim();

        if (wName === "") { alert("कृपया वॉर्डचे नाव टाका!"); return; }

        let payload = { action: "addNewWard", unitName: uName, wardName: wName };
        
        fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(response => response.json())
        .then(data => {
            alert("✅ " + uName + " मध्ये '" + wName + "' यशस्वीरित्या जोडला गेला!");
            hideAddWardForm();
            setTimeout(() => location.reload(), 800); 
        })
        .catch(error => {
            alert("❌ वॉर्ड ॲड करताना एरर आला. 'New version' Deploy केले आहे का तपासा.");
        });
    }

    </script>
</body>
</html>
